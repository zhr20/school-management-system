<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة حساب جديد - نظام إدارة المدرسة</title>
    <link rel="stylesheet" href="css/main.min.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(to bottom, #f3f4f6, #e5e7eb);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .form-container {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            max-width: 600px;
            width: 100%;
        }
        .form-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e5e7eb;
        }
        .form-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #9333ea;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .close-btn {
            width: 40px;
            height: 40px;
            border-radius: 0.5rem;
            border: none;
            background: #f3f4f6;
            color: #6b7280;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .close-btn:hover {
            background: #e5e7eb;
            color: #374151;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.5rem;
        }
        .form-group label .required {
            color: #ef4444;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            transition: all 0.2s;
            font-family: inherit;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #9333ea;
            box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.1);
        }
        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e5e7eb;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .btn-primary {
            background: #9333ea;
            color: white;
        }
        .btn-primary:hover {
            background: #7e22ce;
        }
        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }
        .btn-secondary:hover {
            background: #e5e7eb;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .success-message {
            background: #10b981;
            color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            display: none;
        }
        .error-message {
            background: #ef4444;
            color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <h1>
                <i class="fas fa-wallet"></i>
                إضافة حساب جديد
            </h1>
            <button class="close-btn" onclick="window.close()" title="إغلاق">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div id="successMessage" class="success-message">
            <i class="fas fa-check-circle"></i> تم إضافة الحساب بنجاح!
        </div>

        <div id="errorMessage" class="error-message">
            <i class="fas fa-exclamation-circle"></i> <span id="errorText"></span>
        </div>

        <form id="feeForm" class="space-y-4">
            <div class="form-group">
                <label>المرحلة الدراسية <span class="required">*</span></label>
                <select id="feeClass" required>
                    <option value="">اختر المرحلة</option>
                    <option value="الصف الأول">الصف الأول</option>
                    <option value="الصف الثاني">الصف الثاني</option>
                    <option value="الصف الثالث">الصف الثالث</option>
                </select>
            </div>

            <div class="form-group">
                <label>مبلغ القسط <span class="required">*</span></label>
                <input id="feeAmount" type="number" min="0" step="0.01" required placeholder="مثال: 5000" />
            </div>

            <div class="form-group">
                <label>الوصف</label>
                <textarea id="feeDescription" rows="3" placeholder="وصف القسط..."></textarea>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="window.close()">إلغاء</button>
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <i class="fas fa-save"></i> حفظ
                </button>
            </div>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script>
        const form = document.getElementById('feeForm');
        const submitBtn = document.getElementById('submitBtn');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        function showSuccess() {
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
            form.reset();
            setTimeout(() => {
                successMessage.style.display = 'none';
                window.close();
            }, 2000);
        }

        function showError(message) {
            errorText.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

        function hideMessages() {
            successMessage.style.display = 'none';
            errorMessage.style.display = 'none';
        }

        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            hideMessages();

            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';

            try {
                const classValue = document.getElementById('feeClass').value;
                const amount = parseFloat(document.getElementById('feeAmount').value);
                const description = document.getElementById('feeDescription').value.trim();

                // التحقق من الحقول المطلوبة
                if (!classValue || !amount || amount < 0) {
                    showError('يرجى ملء جميع الحقول المطلوبة بشكل صحيح');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                    return;
                }

                const formData = {
                    class_name: classValue,
                    fee_amount: amount,
                    description: description || ''
                };

                const response = await accountsAPI.saveFee(formData);

                if (response && response.success) {
                    showSuccess();
                    // إرسال رسالة للصفحة الأصلية لتحديث القائمة
                    if (window.opener) {
                        window.opener.postMessage({ type: 'accountAdded', data: response.data }, '*');
                    }
                } else {
                    const errorMsg = response?.message || 'حدث خطأ أثناء إضافة الحساب';
                    showError(errorMsg);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                }
            } catch (error) {
                console.error('Error saving account:', error);
                showError('حدث خطأ أثناء إضافة الحساب: ' + (error.message || 'خطأ غير معروف'));
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        });

        // إغلاق عند الضغط على Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                window.close();
            }
        });
    </script>
</body>
</html>
